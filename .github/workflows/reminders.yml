name: Trip reminders

# Every morning, 10am Central. The job itself decides what is actually due —
# an RSVP nudge three weeks out, a cooking reminder the night before, and a
# one-week warning — and records what it sent so a daily schedule does not
# put the same email in somebody's inbox seven times.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      live:
        description: 'Send for real (otherwise dry run)'
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Send reminders
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          # Stays a dry run until REMINDERS_LIVE is set to 1 in repository
          # variables, or a manual run ticks the box. Nothing reaches anyone's
          # inbox on a schedule that has not been watched first.
          DRY_RUN: ${{ (vars.REMINDERS_LIVE == '1' || inputs.live) && '0' || '1' }}
        run: node scripts/reminders.mjs
